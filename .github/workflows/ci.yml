name: Nexus functional gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run manifest:check
      - run: command -v google-chrome
      - run: npm run qa && npm run qa:browser
        env:
          NEXUS_CHROME_PATH: /usr/bin/google-chrome
          NEXUS_QA_OUTPUT_DIR: .qa/ci
          NEXUS_QA_SOFTWARE_RENDERER: "1"
          # Les runners hébergés utilisent un renderer logiciel variable.
          # La porte matérielle locale reste à 30 FPS de médiane et 24 FPS minimum.
          NEXUS_MIN_FPS: "1"
          NEXUS_MIN_SAMPLE_FPS: "1"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: nexus-browser-qa
          path: .qa/ci/
          if-no-files-found: warn
